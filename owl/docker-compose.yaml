

services:
  owl:
    image: owl:1.0.0
    container_name: owl-back
    restart: always
    ports:
      - "30023:8080"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

